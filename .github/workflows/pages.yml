name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/prepare_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static page
        run: python3 scripts/prepare_pages.py --base-path /pixelplustest
      - uses: actions/upload-pages-artifact@v4
        with:
          path: outputs/github-pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
